name: Package documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (requires Pages source set to GitHub Actions)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 15
    env:
      LANG: en_US.UTF-8
    steps:
      - name: Install R and documentation dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates locales build-essential r-base-core r-base-dev r-cran-lpsolve r-cran-testthat r-cran-knitr r-cran-rmarkdown r-cran-pkgdown pandoc
          locale-gen en_US.UTF-8
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build pkgdown
        run: /usr/bin/Rscript -e 'pkgdown::build_site()'
      - name: Label the documentation search field
        shell: Rscript {0}
        run: |
          pages <- list.files("docs", pattern = "[.]html$", recursive = TRUE, full.names = TRUE)
          for (page in pages) {
            html <- xml2::read_html(page)
            fields <- xml2::xml_find_all(html, "//input[@id='search-input']")
            if (length(fields)) {
              xml2::xml_set_attr(fields, "aria-label", "Search documentation")
              xml2::write_html(html, page)
            }
          }
          home <- xml2::read_html("docs/index.html")
          stopifnot(length(xml2::xml_find_all(home, "//input[@aria-label='Search documentation']")) == 1L)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pkgdown-site
          path: docs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
